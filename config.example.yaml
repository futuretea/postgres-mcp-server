port: 0
listen: 127.0.0.1
sse_base_url: ""
log_level: info
# Database connection configuration is execution-only. Do not put a host,
# password, or connection URL in this file. Set MCP_POSTGRES_HOST,
# MCP_POSTGRES_PORT, MCP_POSTGRES_DATABASE, MCP_POSTGRES_USERNAME,
# MCP_POSTGRES_PASSWORD, and MCP_POSTGRES_SSLMODE in the environment.
# DATABASE_URL is an optional advanced alternative; when it is set, it wins
# and MCP_POSTGRES_* is ignored. PGHOST, PGPORT, PGDATABASE, PGUSER,
# PGPASSWORD, and PGSSLMODE remain libpq aliases of those discrete fields.
enabled_tools: []
disabled_tools: []
enabled_domains: []
disabled_domains: []
# Skips only the startup database role check. Leave false unless you cannot
# provision a least-privilege role; the read-only guarantee then rests on the
# transaction boundary alone. Also readable as MCP_ALLOW_UNSAFE_DATABASE_ROLE.
allow_unsafe_database_role: false
